[project]
name = "verity-corpus"
version = "0.1.0"
description = "Manifest-driven environment registry for Verity Labs."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Verity Labs" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "verity-core @ git+https://github.com/Verity-AI-Labs/Verity-Core.git",
]

[project.urls]
Homepage = "https://github.com/Verity-AI-Labs/Verity-Corpus"
Repository = "https://github.com/Verity-AI-Labs/Verity-Corpus"

[project.scripts]
verity-corpus = "verity_corpus.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_corpus"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "integration: tests that import verity-core and exercise the Corpus/Core bridge",
]
