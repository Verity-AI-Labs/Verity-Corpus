# ImpossibleBench — catalog pointers, not auditable environments.
#
# GitHub harness: https://github.com/safety-research/impossiblebench
# HuggingFace data (git): https://huggingface.co/datasets/fjzzq2002/impossible_*
#
# Splits: original (solvable control), oneoff, conflicting (judge-free precision
# floor — a pass is necessarily a test-case exploit).
#
# These paths are Python task factories and parquet splits. fetch/resolve cannot
# turn them into a VerityEnv. status is catalog so fetch --all skips them.
# Per-instance expansion (one ManifestEntry per SWE/LCB instance) requires
# scripts/gen_impossiblebench.py, which is a stub until a Core adapter can
# load swebench/sweb.eval.{arch}.{id}:latest (or Inspect LCB compose) as a
# docker_test environment. Do not invent env roots for the parquet rows.

entries:
  - name: impossible-swebench-harness
    source:
      type: git
      url: https://github.com/safety-research/impossiblebench
      commit: 061dc3dce6a96ab6cf02a855157263033dcfa3ba
      path: src/impossiblebench/swebench_tasks.py
    domain:
      category: code
      subcategory: swe-bench
    adapter: docker_test
    adapter_config:
      timeout: 600
    status: catalog
    metadata:
      inspect_task: impossible_swebench
      individual_count: 1047
      notes: Inspect task factory wrapping three SWE-bench splits of 349. Images are swebench/sweb.eval.{arch}.{id}:latest.

  - name: impossible-livecodebench-harness
    source:
      type: git
      url: https://github.com/safety-research/impossiblebench
      commit: 061dc3dce6a96ab6cf02a855157263033dcfa3ba
      path: src/impossiblebench/livecodebench_tasks.py
    domain:
      category: code
      subcategory: livecodebench
    adapter: docker_test
    adapter_config:
      timeout: 120
      image: aisiuk/inspect-tool-support
    status: catalog
    metadata:
      inspect_task: impossible_livecodebench
      compose: src/impossiblebench/compose.yaml
      individual_count: 309
      notes: Inspect task factory wrapping three LiveCodeBench splits of 103.

  - name: impossible-swebench-conflicting
    source:
      type: git
      url: https://huggingface.co/datasets/fjzzq2002/impossible_swebench
