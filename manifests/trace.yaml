# TRACE (Scaling Intelligence) — catalog pointers, not auditable environments.
#
# Repo: https://github.com/ScalingIntelligence/TRACE
# TRACE synthesizes capability-targeted training environments; it is not a
# static dump of hundreds of task directories. What is committed:
#
#   game_registry.py
#       GameSpec registry. Auto-imports capability_*_game.py at project root.
#   swebench/qwen3.6_self_trace/capability_semantic_logic_precision_game.py
#       The one capability GameEnv checked in (SWE-bench Verified run).
#   swebench/qwen3.6_self_trace/trace_v4_scenarios.py
#       Loads scenarios_v4_all.json (NOT in git — produced by phase 3 synth).
#   swebench/qwen3.6_self_trace/phase3_synth_*.py
#       Generators for additional capability environments.
#
# These paths are Python sources. fetch/resolve cannot turn them into a
# VerityEnv (Core's verifiers adapter needs reward/rollout callables, not a
# GameEnv class). status is catalog so fetch --all skips them.
# Per-instance expansion after a TRACE run requires scripts/gen_trace.py,
# which is a stub until that adapter exists. Do not treat .py files as envs.

source_defaults:
  type: git
  url: https://github.com/ScalingIntelligence/TRACE
  commit: d2db23085409555b3f13ea426f42d62cf0bbc43d

entries:
  - name: capability-semantic-logic-precision
    path: swebench/qwen3.6_self_trace/capability_semantic_logic_precision_game.py
    domain:
      category: code
      subcategory: swe-bench
    adapter: verifiers
    adapter_config:
      timeout: 120
    status: catalog
    metadata:
      game_spec: capability_semantic_logic_precision
      individual_count: 1
      notes: Single-turn SEARCH/REPLACE GameEnv targeting semantic-logic failures. Not a VerityEnv.

  - name: trace-v4-scenarios
    path: swebench/qwen3.6_self_trace/trace_v4_scenarios.py
    domain:
      category: code
      subcategory: swe-bench
    adapter: verifiers
    adapter_config:
      timeout: 60
    status: catalog
    metadata:
      scenario_file: scenarios_v4_all.json
      individual_count: 0
      notes: Scenario library loader; JSON is generated by phase3 and is not in git.

  - name: phase3-synth-semantic-logic-precision
    path: swebench/qwen3.6_self_trace/phase3_synth_semantic_logic_precision.py
    domain:
      category: code
      subcategory: environment-generation
    adapter: verifiers
    adapter_config:
      timeout: 120
    status: catalog
    metadata:
      role: environment_generator
      capability: semantic-logic-precision
      individual_count: 0
      notes: Generator script, not an environment.

  - name: phase3-synth-deep-call-graph-traversal
    path: swebench/qwen3.6_self_trace/phase3_synth_deep_call_graph_traversal.py
    domain:
      category: code
      subcategory: environment-generation
    adapter: verifiers
    adapter_config:
      timeout: 120
    status: catalog
    metadata:
      role: environment_generator
      capability: deep-call-graph-traversal
      individual_count: 0
      notes: Generator script, not an environment.
