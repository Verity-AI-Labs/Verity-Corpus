# Terminal Wrench — representative sample (15 of 331 tasks).
#
# Layout in the upstream repo (https://github.com/few-sh/terminal-wrench):
#   tasks/<task_id>/<model>/original_task/{instruction.md,tests,solution,environment/Dockerfile,task.toml}
# The original_task tree is the Terminal-Bench environment. It is duplicated
# under each model directory; we pin path to the claude-opus-4.6 copy.
#
# Full catalog for later programmatic expansion:
#   index/tasks.json              — one row per task/model entry (~18 MB)
#   task_source_datasets.json     — task_id → source benchmark(s)
#   dataset_manifest.json         — aggregate counts
#
# Difficulty labels come from original_task/task.toml [metadata].difficulty.
# Core's ContainerEnv cannot build from a Dockerfile (TODO in Core). Run
#   python scripts/build_images.py --repo-root <fetched TW clone>
# first so `verity-tw:{task_id}` tags exist locally. `dockerfile` is kept
# in metadata for that script; adapter_config.image is what resolve() uses.

source_defaults:
  type: git
  url: https://github.com/few-sh/terminal-wrench
  commit: d8a29613235a0ef56a8b70b3142626a533da28c2

entries:
  # --- easy ---
  - name: cobol-modernization
    path: tasks/cobol-modernization/claude-opus-4.6/original_task
    domain:
      category: terminal
      subcategory: bash
    adapter: terminal
    adapter_config:
      timeout: 180
      image: verity-tw:cobol-modernization
    metadata:
      dockerfile: environment/Dockerfile
      source_benchmark: TerminalBench-original
      difficulty: easy
      category: software-engineering

